name: Deploy to Hostinger
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create deployment zip
        run: |
          zip -r aurora_site_deploy.zip . \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "*.md" \
            --exclude "node_modules/*" \
            --exclude "*.py"
          echo "Zip size: $(du -sh aurora_site_deploy.zip)"

      - name: Deploy to Hostinger
        env:
          HOSTINGER_TOKEN: ujqd3QL6BMCARTRpNwwwNJGqmTZ6CJRpyhWb0w5Iad6daa92
        run: python3 deploy_to_hostinger.py
